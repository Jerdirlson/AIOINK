# Definición del proyecto de Xcode. Se genera con XcodeGen para no versionar
# un .xcodeproj (que es ruidoso en los diffs y propenso a conflictos).
#
#   cd ios && xcodegen generate && open IAOINK.xcodeproj

name: IAOINK
options:
  bundleIdPrefix: app.iaoink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Modo de lenguaje Swift 5. Sin concurrencia estricta por ahora: se
    # activará cuando el proyecto compile de forma estable en el Mac.
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IAOINK:
    type: application
    platform: iOS
    sources:
      - path: IAOINK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.iaoink.IAOINK
        PRODUCT_NAME: IAOINK
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Solo retrato: la app es una lista vertical, el apaisado no aporta.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: IAOINK
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: IAOINK/Info.plist
      properties:
        CFBundleDisplayName: IAOINK
        # En desarrollo la API corre en http://localhost:3000 sin TLS. Esto
        # habilita HTTP solo hacia la red local, no hacia internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
